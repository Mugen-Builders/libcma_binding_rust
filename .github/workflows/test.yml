name: test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Default backend: pure-Rust MOCK ledger. Needs no C++ toolchain, no network, no
  # submodule source beyond the headers — the fast, always-on gate.
  mock-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      # DEPENDENCIES.lock is the human-readable record of which upstream revisions the
      # submodules are pinned to. It drifted from the actual pins before (it named
      # machine-guest-tools v0.17.2 while the submodule sat on a later main commit), and a
      # wrong record is worse than none when the question is "which libcmt is this built
      # against?". Cheap to assert, so assert it on every push.
      - name: Verify DEPENDENCIES.lock matches the submodule pins
        run: |
          set -euo pipefail
          status=0
          while read -r repo tag sha; do
            [[ -z "${repo:-}" || "${repo:0:1}" == "#" ]] && continue
            path="third_party/${repo##*/}"
            actual=$(git ls-tree HEAD "$path" | awk '{print $3}')
            if [[ -z "$actual" ]]; then
              echo "::error::DEPENDENCIES.lock names $repo but $path is not a submodule of this tree"
              status=1
            elif [[ "$actual" != "$sha" ]]; then
              echo "::error::$repo ($tag): DEPENDENCIES.lock says $sha, $path is pinned to $actual"
              status=1
            else
              echo "ok: $repo $tag $sha"
            fi
          done < DEPENDENCIES.lock
          exit $status

      - name: Install libclang for bindgen
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - name: Run mocked tests
        run: cargo test --features mock

  # Formatting, lints, and docs. All three steps run even if an earlier one fails
  # (`if: ${{ !cancelled() }}`) so each reports independently.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install libclang for bindgen
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      # NOTE: this is a CHECK only — it never rewrites source. At the time this job was
      # added the tree was NOT fully rustfmt-clean (pre-existing formatting in build.rs
      # and src/*.rs owned by another workstream), so this step will stay RED until a
      # one-time `cargo fmt --all` pass lands. That pass is a tracked follow-up.
      - name: rustfmt (check only)
        if: ${{ !cancelled() }}
        run: cargo fmt --all --check

      # WARNING-ONLY for now: there are pre-existing clippy lints in src/ that are owned
      # by another workstream and must not be fixed here. Once they are cleared, tighten
      # this to `-- -D warnings` so new lints fail CI.
      # TODO(clippy-deny): append `-- -D warnings` after the src/ clippy cleanup lands.
      - name: clippy (mock)
        if: ${{ !cancelled() }}
        run: cargo clippy --features mock --all-targets

      - name: cargo doc (mock)
        if: ${{ !cancelled() }}
        run: cargo doc --no-deps --features mock

  # REAL libcma compiled + linked for the host (x86_64). This is the backend that must
  # produce byte-identical records to the riscv64 build, so it exercises the real C++
  # ledger and the records-layout / reproducibility tests. Needs a g++ >= 14 toolchain,
  # bindgen's libclang, and network access (Boost + nlohmann/json are fetched by build.rs).
  host-real-tests:
    runs-on: ubuntu-latest
    env:
      # build.rs's host path honours these (default g++/gcc, which on the runner is < 14).
      CMA_HOST_CXX: g++-14
      CMA_HOST_CC: gcc-14
      # bindgen's builtin-header fallback shells out to $CC; keep it on the same major.
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Install C++ toolchain + bindgen/build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++-14 gcc-14 build-essential \
            clang libclang-dev \
            wget make cmake

      - name: Build + run host-real tests (real libcma linked for the host)
        run: cargo test --no-default-features --features host-real -- --nocapture

  riscv-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev build-essential cmake

      - name: Build libcma for riscv64
        working-directory: third_party/machine-asset-tools
        run: |
          make third-party-boost
          make docker ARGS="build/riscv64/libcma.a"

      - name: Verify riscv64 libcma artifact
        run: |
          set -euo pipefail
          lib=third_party/machine-asset-tools/build/riscv64/libcma.a
          if [[ ! -f "$lib" ]]; then
            echo "Missing $lib"
            ls -laR third_party/machine-asset-tools/build/riscv64 || true
            exit 1
          fi
          member=$(ar t "$lib" | head -1)
          obj=$(mktemp)
          ar p "$lib" "$member" > "$obj"
          file "$obj" | grep -F 'RISC-V'
          rm -f "$obj"

      # Inspecting the archive is not enough: libcma.a's parser_impl.o references libcmt's
      # cmt_abi_*/cmt_buf_* symbols, which live OUTSIDE the archive. Archive members are pulled
      # lazily, so a missing libcmt only shows up when something actually calls the C parser.
      # This links a real riscv64 binary that does, against the same `-lcma -lcmt` that build.rs
      # emits for the riscv64 backend, inside the builder image where the machine-guest-tools
      # package supplies libcmt. tests/c_parser_link.rs is the host-side counterpart.
      - name: Link a real riscv64 binary against libcma + libcmt
        working-directory: third_party/machine-asset-tools
        run: |
          set -euo pipefail
          cat > cmt_link_probe.c <<'PROBE'
          #include <libcma/parser.h>
          #include <string.h>
          int main(void) {
              unsigned char payload[52];
              memset(payload, 0, sizeof payload);
              payload[19] = 1;    /* sender */
              payload[51] = 4;    /* value  */
              cmt_rollup_advance_t advance;
              memset(&advance, 0, sizeof advance);
              advance.payload.length = sizeof payload;
              advance.payload.data = payload;
              cma_parser_input_t out;
              memset(&out, 0, sizeof out);
              /* Forces parser_impl.o (and therefore libcmt) into the link. */
              return cma_parser_decode_advance(
                  CMA_PARSER_INPUT_TYPE_ETHER_DEPOSIT, &advance, &out) == 0 ? 0 : 1;
          }
          PROBE
          # The probe is written into the working directory rather than /tmp so that the single
          # existing mount carries it — a second `-v /tmp/...` bind is refused outright by Docker
          # Desktop, which does not share /tmp by default.
          trap 'rm -f cmt_link_probe.c' EXIT
          docker run --platform linux/riscv64 --rm \
            -v "$PWD":/mnt/app -w /mnt/app libcma-builder \
            bash -euxc '
              g++ -std=c++20 -Iinclude -Ithird-party -x c++ cmt_link_probe.c \
                  -L build/riscv64 -lcma -lcmt -lstdc++ -o /tmp/cmt_link_probe
              # `readelf`, not `file`: the builder image ships binutils (it has g++) but no
              # file(1). The neighbouring artifact check can use file(1) because it runs on the
              # runner rather than inside this container.
              readelf -h /tmp/cmt_link_probe | grep -F "RISC-V"
              # Runs natively here (the container IS riscv64), so this also proves the linked
              # C parser actually decodes the vector rather than merely resolving symbols.
              /tmp/cmt_link_probe
            '

      # The above proves the C side links. This proves what a real Cartesi application needs:
      # that the CRATE cross-links into a FULLY STATIC riscv64 executable.
      #
      # It has to be an executable — `cargo build` on a library only emits an rlib, whose members
      # are pulled lazily, so a library build cannot see a missing or wrongly-bound native
      # dependency. And it has to be static: the Cartesi machine's rootfs has no `/lib/ld.so.1`,
      # so an application retaining any NEEDED entry cannot be exec'd, and the machine says only
      # `dapp failed to start with No such file or directory`. A dynamically-bound libstdc++ used
      # to slip through exactly here.
      - name: Cross-link a fully static riscv64 Rust binary
        env:
          CMA_RISCV64_CXX: riscv64-linux-gnu-g++-14
          CMA_RISCV64_CC: riscv64-linux-gnu-gcc-14
          MACHINE_GUEST_TOOLS_VERSION: "0.18.0"
        run: |
          set -euxo pipefail
          sudo apt-get install -y --no-install-recommends \
            g++-14-riscv64-linux-gnu gcc-14-riscv64-linux-gnu binutils-riscv64-linux-gnu
          rustup target add riscv64gc-unknown-linux-gnu

          # Stage libcmt.a from the machine-guest-tools package into the cross sysroot, the same
          # way an application Dockerfile must (see the README).
          curl -fsSL -o /tmp/gt.deb \
            "https://github.com/cartesi/machine-guest-tools/releases/download/v${MACHINE_GUEST_TOOLS_VERSION}/machine-guest-tools_riscv64.deb"
          dpkg-deb -x /tmp/gt.deb /tmp/gt
          sudo cp -a /tmp/gt/usr/lib/libcmt.a   /usr/riscv64-linux-gnu/lib/
          sudo cp -a /tmp/gt/usr/include/libcmt /usr/riscv64-linux-gnu/include/

          RUSTFLAGS="-C target-feature=+crt-static -C linker=riscv64-linux-gnu-g++-14" \
            cargo build --release --no-default-features --features riscv64 \
              --target riscv64gc-unknown-linux-gnu --example link_probe

          bin=target/riscv64gc-unknown-linux-gnu/release/examples/link_probe
          file "$bin" | grep -F 'RISC-V'
          if riscv64-linux-gnu-readelf -l "$bin" | grep -i 'interpreter'; then
            echo "::error::riscv64 binary requests an ELF interpreter; the machine rootfs has no /lib/ld.so.1"
            exit 1
          fi
          if riscv64-linux-gnu-readelf -d "$bin" 2>/dev/null | grep 'NEEDED'; then
            echo "::error::riscv64 binary has dynamic dependencies; it must be fully static"
            exit 1
          fi
          echo "ok: fully static riscv64 executable, no interpreter and no NEEDED entries"

  # ===========================================================================
  # TODO(cross-arch-differential): the ULTIMATE host<->machine reproducibility
  # invariant — not yet implemented (heavy: needs a riscv64 build AND running it
  # under QEMU user emulation, then a byte-for-byte image diff).
  #
  # tests/host_real_records_layout.rs already pins the 32-byte record layout and
  # asserts host determinism, and riscv-link-check proves the riscv64 archive
  # builds. The missing piece is proving the two backends emit the SAME records
  # image for the SAME credits, byte for byte — the property that makes off-chain
  # host prediction of the on-chain ledger sound.
  #
  # Intended shape of the job:
  #   cross-arch-differential:
  #     runs-on: ubuntu-latest
  #     steps:
  #       - uses: actions/checkout@v4
  #         with: { submodules: recursive }
  #       - uses: dtolnay/rust-toolchain@stable
  #       - uses: docker/setup-qemu-action@v3   # register binfmt for riscv64 user emu
  #       - name: Install host + riscv64 GCC 14 toolchains, libclang, qemu-user
  #         run: |
  #           sudo apt-get update
  #           sudo apt-get install -y \
  #             g++-14 gcc-14 g++-14-riscv64-linux-gnu gcc-14-riscv64-linux-gnu \
  #             build-essential clang libclang-dev wget make cmake \
  #             qemu-user qemu-user-static libc6-riscv64-cross libstdc++6-riscv64-cross
  #       # 1. Build a tiny harness that credits a FIXED (address, balance) set into a
  #       #    buffer-backed single-asset ledger and writes the 128 KiB records prefix
  #       #    to a file. Build it twice from the same source:
  #       #      a) host-real  -> native x86_64 binary   -> host.records
  #       #      b) riscv64    -> riscv64 binary, run via `qemu-riscv64` -> riscv.records
  #       #    (The riscv64 crate currently builds a static archive; a small #[no_mangle]
  #       #     entrypoint or an integration test cross-compiled to riscv64-unknown-linux-gnu
  #       #     and executed under qemu is the mechanism to add.)
  #       # 2. Assert byte-for-byte equality:
  #       #       cmp host.records riscv.records
  #       #    A mismatch means the host can NOT soundly predict the machine ledger and
  #       #    must fail CI hard.
  # ===========================================================================
